<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vibecoder promo (10s)</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: #050405; color: #f4f1f0; font-family: system-ui, sans-serif; }
  .wrap { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 14px; box-sizing: border-box; }
  canvas { max-width: 100%; max-height: calc(100vh - 92px); border-radius: 10px; box-shadow: 0 20px 80px rgba(224, 88, 74, .12); }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; align-items: center; }
  button, select { font: inherit; font-size: 14px; color: #f4f1f0; background: #1a1719; border: 1px solid #332e31; border-radius: 8px; padding: 9px 14px; cursor: pointer; }
  button:hover, select:hover { border-color: #e0584a; }
  button.primary { background: #e0584a; border-color: #e0584a; color: #fff; }
  .hint { font-size: 12px; color: #8d8587; }
</style>
</head>
<body>
<div class="wrap">
  <canvas id="c"></canvas>   
 </div>

<script>
/* ==========================================================================
   EDIT HERE — copy, logo and colours
   ========================================================================== */
const CONFIG = {
  brand: "vibecoder",
  logoColor: "#FD3535",   // official logo colour (from newlogo.svg)
  headline: "The AI coding agent that lives on your desktop.",
  terminalTitle: "vibecoder — zsh",
  points: ["No subscription.", "No credits.", "Your API keys, your machine, your code."],
  cta: "Download for macOS",
  footnote: "Free & open source · macOS, Windows, Linux",
  endCredit: "",  // optional small line at the very end, e.g. "Animation made with Claude Code"
  colors: { bg: "#0b0a0c", accent: "#e0584a", accentLight: "#ff9080", text: "#f4f1f0", muted: "#9b9290", green: "#5ec27a", red: "#e0584a" }
};
// Terminal script (times in seconds). type:true = typed char by char.
const TERMINAL = [
  { at: 4.7, dur: 0.5, type: true, prompt: true, text: "cd ~/projects/shop-api" },
  { at: 5.3, dur: 0.6, type: true, prompt: true, text: 'vibecoder "add Stripe checkout"' },
  { at: 6.1, text: "✓ Read 42 files", color: "green" },
  { at: 6.3, text: "✓ Planned 3 changes", color: "green" },
  { at: 6.5, text: "✎ Editing src/checkout.ts", color: "accent" },
  { at: 6.7, text: "- const total = cart.sum()", color: "red", diff: true },
  { at: 6.85, text: "+ const total = applyTax(cart.sum())", color: "green", diff: true },
  { at: 7.0, text: "+ await stripe.checkout.create({ total })", color: "green", diff: true }
];
const DURATION = 10;
/* ========================================================================== */

const C = CONFIG.colors;
const SANS = '"Inter","SF Pro Display","Helvetica Neue",Arial,system-ui,sans-serif';
const MONO = 'ui-monospace,SFMono-Regular,Menlo,Consolas,monospace';
const TAU = Math.PI * 2;

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let W = 1920, H = 1080, L = {}, format = "landscape";

/* ---------- helpers ---------- */
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const easeOut = k => 1 - Math.pow(1 - k, 3);
const easeInOut = k => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
const easeBack = k => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
function kf(t, frames) {
  if (t <= frames[0][0]) return frames[0][1];
  for (let i = 1; i < frames.length; i++) {
    if (t <= frames[i][0]) { const [t0, v0] = frames[i - 1], [t1, v1] = frames[i]; return lerp(v0, v1, easeInOut((t - t0) / (t1 - t0))); }
  }
  return frames[frames.length - 1][1];
}
function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function setFont(weight, size, family, ls) {
  ctx.font = `${weight} ${size}px ${family}`;
  if ("letterSpacing" in ctx) ctx.letterSpacing = ls || "0px";
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function wrap(text, maxW) {
  const words = text.split(" "), lines = []; let cur = "";
  for (const w of words) {
    const test = cur ? cur + " " + w : w;
    if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = w; } else cur = test;
  }
  if (cur) lines.push(cur);
  return lines;
}

/* ---------- official logo (newlogo.svg) + construction guides (lines.svg) ---------- */
const LOGO_PATH = new Path2D("M4.41602 10L8.41406 19H4C1.79086 19 1.61066e-08 17.2091 0 15V10H4.41602ZM17.1211 0.609375C18.2493 1.31663 19 2.57024 19 4V15C19 17.2091 17.2091 19 15 19H11.8701L17.1211 0.609375ZM12 0C12.0006 3.76417e-08 13.5 0.000194028 13.5 1C13.5 1.61646 11.4093 9.25716 9.80859 15.0283L6.52148 7.62891C6.52403 7 6.52914 7 5.83301 7H0V4C0 1.79086 1.79086 1.61064e-08 4 0H12Z");
// Guides in logo coordinates (0..19): two vertical + two horizontal lines and the four corner circles.
const GUIDES = [[8, -4, 8, 23], [11, -4, 11, 23], [-4, 8, 23, 8], [-4, 11, 23, 11]];
const CIRCLES = [[4, 4], [15, 4], [4, 15], [15, 15]];

/* ---------- layout per format ---------- */
function layout() {
  if (format === "landscape") {
    W = 1920; H = 1080;
    L = { globeY: H / 2, globeR: H * 0.42, headerY: H * 0.09, fsH: 96, headTop: H * 0.16, headMaxW: W * 0.7,
      term: { x: W * 0.16, y: H * 0.44, w: W * 0.68, h: H * 0.5 }, fm: 30, lineH: 46,
      fsP: 76, pTop: H * 0.28, pMaxW: W * 0.8, ctaY: H * 0.76, fsC: 44, fsF: 28 };
  } else {
    W = 1080; H = 1920;
    L = { globeY: H / 2, globeR: W * 0.5, headerY: H * 0.07, fsH: 84, headTop: H * 0.13, headMaxW: W * 0.88,
      term: { x: W * 0.05, y: H * 0.36, w: W * 0.9, h: H * 0.34 }, fm: 32, lineH: 50,
      fsP: 72, pTop: H * 0.27, pMaxW: W * 0.86, ctaY: H * 0.7, fsC: 44, fsF: 30 };
  }
  canvas.width = W; canvas.height = H;

  // headline word layout
  setFont(800, L.fsH, SANS, "-0.03em");
  const lines = wrap(CONFIG.headline, L.headMaxW);
  const space = ctx.measureText(" ").width;
  L.words = []; let idx = 0;
  lines.forEach((line, li) => {
    const ws = line.split(" ");
    const widths = ws.map(w => ctx.measureText(w).width);
    const total = widths.reduce((a, b) => a + b, 0) + space * (ws.length - 1);
    let x = W / 2 - total / 2;
    ws.forEach((w, i) => {
      L.words.push({ text: w, x, y: L.headTop + L.fsH * 0.85 + li * L.fsH * 1.08, i: idx++ });
      x += widths[i] + space;
    });
  });

  // paragraph layout for the three points
  setFont(700, L.fsP, SANS, "-0.02em");
  L.paras = [];
  let py = L.pTop;
  CONFIG.points.forEach((p, i) => {
    const pl = wrap(p, L.pMaxW);
    L.paras.push({ lines: pl, y: py, at: 7.6 + i * 0.5 });
    py += pl.length * L.fsP * 1.15 + L.fsP * 0.15;
  });
}

/* ---------- globe ---------- */
const N = 2200;
const rnd = rng(7);
const dots = [];
for (let i = 0; i < N; i++) {
  const y = 1 - (i / (N - 1)) * 2, r = Math.sqrt(1 - y * y), th = Math.PI * (3 - Math.sqrt(5)) * i;
  dots.push({ tx: Math.cos(th) * r, ty: y, tz: Math.sin(th) * r, sx: (rnd() - 0.5) * 3.2, sy: (rnd() - 0.5) * 3.2, sz: (rnd() - 0.5) * 3.2, d: rnd() });
}
const nodes = []; for (let i = 0; i < 8; i++) { const d = dots[(rnd() * N) | 0]; nodes.push({ p: [d.tx, d.ty, d.tz], ph: rnd() * TAU }); }
const arcs = []; for (let i = 0; i < 5; i++) {
  const a = nodes[i % nodes.length], b = nodes[(i + 3) % nodes.length];
  arcs.push({ a: a.p, b: b.p, t0: 1.9 + i * 0.7, lift: 0.22 + rnd() * 0.25 });
}
function arcPoint(arc, u) {
  const A = arc.a, B = arc.b;
  const dt = clamp(A[0] * B[0] + A[1] * B[1] + A[2] * B[2], -1, 1), om = Math.acos(dt), so = Math.sin(om) || 1e-6;
  const wa = Math.sin((1 - u) * om) / so, wb = Math.sin(u * om) / so, h = 1 + arc.lift * Math.sin(Math.PI * u);
  return [(A[0] * wa + B[0] * wb) * h, (A[1] * wa + B[1] * wb) * h, (A[2] * wa + B[2] * wb) * h];
}
const BUCKETS = 7;
const px = new Float32Array(N), py = new Float32Array(N), bk = new Uint8Array(N);

function drawGlobe(t, ga) {
  const cx = W / 2, cy = L.globeY, R = L.globeR;
  const yaw = t * 0.42 + 0.6, pitch = 0.38;
  const cs = Math.cos(yaw), sn = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
  const proj = (x, y, z) => { const X = x * cs + z * sn, Z0 = -x * sn + z * cs, Y = y * cp - Z0 * sp, Z = y * sp + Z0 * cp; return [cx + X * R, cy - Y * R, Z]; };

  for (let i = 0; i < N; i++) {
    const d = dots[i], p = easeInOut(seg(t, 0.1 + d.d * 0.8, 1.7 + d.d * 0.8));
    const x = lerp(d.sx, d.tx, p), y = lerp(d.sy, d.ty, p), z = lerp(d.sz, d.tz, p);
    const q = proj(x, y, z);
    px[i] = q[0]; py[i] = q[1]; bk[i] = Math.min(BUCKETS - 1, ((q[2] + 1.6) / 3.2 * BUCKETS) | 0);
  }
  ctx.fillStyle = C.accent;
  for (let b = 0; b < BUCKETS; b++) {
    const f = (b + 0.5) / BUCKETS;
    ctx.globalAlpha = ga * (0.1 + 0.85 * Math.pow(f, 1.6));
    const s = 2.6 * (0.7 + 0.7 * f);
    for (let i = 0; i < N; i++) if (bk[i] === b) ctx.fillRect(px[i] - s / 2, py[i] - s / 2, s, s);
  }
  ctx.globalAlpha = 1;

  const vis = seg(t, 1.7, 2.3) * ga;
  if (vis <= 0) return;
  ctx.lineCap = "round";
  for (const arc of arcs) {
    if (t < arc.t0) continue;
    const prog = ((t - arc.t0) % 4.2) / 2.4;
    const head = Math.min(prog, 1), fade = prog > 1 ? Math.max(0, 1 - (prog - 1) / 0.5) : 1;
    if (fade <= 0 || head < 0.02) continue;
    const steps = Math.max(2, Math.floor(56 * head)); let prev = null;
    for (let s = 0; s <= steps; s++) {
      const u = (s / steps) * head, v = proj(...arcPoint(arc, u));
      if (prev && v[2] > -0.15 && prev[2] > -0.15) {
        const near = head - u < 0.28 ? 1 - (head - u) / 0.28 : 0;
        ctx.strokeStyle = near > 0.4 ? C.accentLight : C.accent;
        ctx.globalAlpha = clamp((0.16 + 0.7 * near) * fade * Math.min(1, (v[2] + 0.3) * 1.4)) * vis;
        ctx.lineWidth = 1.2 + near * 2;
        ctx.beginPath(); ctx.moveTo(prev[0], prev[1]); ctx.lineTo(v[0], v[1]); ctx.stroke();
      }
      prev = v;
    }
    if (prog <= 1 && prev && prev[2] > -0.1) {
      const g = ctx.createRadialGradient(prev[0], prev[1], 0, prev[0], prev[1], 22);
      g.addColorStop(0, C.accentLight); g.addColorStop(1, "rgba(224,88,74,0)");
      ctx.globalAlpha = vis; ctx.fillStyle = g; ctx.beginPath(); ctx.arc(prev[0], prev[1], 22, 0, TAU); ctx.fill();
    }
  }
  for (const n of nodes) {
    const q = proj(...n.p); if (q[2] < -0.25) continue;
    const v = Math.min(1, (q[2] + 0.25) * 1.6) * vis, pulse = 0.5 + 0.5 * Math.sin(t * 2.4 + n.ph), rad = 24 + 20 * pulse;
    const g = ctx.createRadialGradient(q[0], q[1], 0, q[0], q[1], rad);
    g.addColorStop(0, C.accentLight); g.addColorStop(0.35, "rgba(224,88,74,.45)"); g.addColorStop(1, "rgba(224,88,74,0)");
    ctx.globalAlpha = v; ctx.fillStyle = g; ctx.beginPath(); ctx.arc(q[0], q[1], rad, 0, TAU); ctx.fill();
    ctx.fillStyle = C.accentLight; ctx.beginPath(); ctx.arc(q[0], q[1], 3.6, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* ---------- logo lockup ---------- */
// Construction: guide lines draw in, four circles trace, then the real logo fills in and the guides fade.
function drawMark(t, size) {
  const k = size / 19;
  ctx.save(); ctx.scale(k, k); ctx.translate(-9.5, -9.5);
  const lw = 1.6 / k, gFade = 1 - seg(t, 2.2, 2.8);
  if (gFade > 0) {
    ctx.lineCap = "round";
    GUIDES.forEach((g, i) => {
      const p = easeOut(seg(t, 1.0 + i * 0.07, 1.7 + i * 0.07)); if (p <= 0) return;
      ctx.strokeStyle = "rgba(255,255,255,.45)"; ctx.lineWidth = lw; ctx.globalAlpha = gFade;
      ctx.beginPath(); ctx.moveTo(g[0], g[1]); ctx.lineTo(lerp(g[0], g[2], p), lerp(g[1], g[3], p)); ctx.stroke();
    });
    CIRCLES.forEach((c, i) => {
      const p = easeInOut(seg(t, 1.3 + i * 0.1, 2.0 + i * 0.1)); if (p <= 0) return;
      ctx.strokeStyle = C.accentLight; ctx.lineWidth = lw * 1.5; ctx.globalAlpha = gFade;
      ctx.beginPath(); ctx.arc(c[0], c[1], 3.975, -Math.PI / 2, -Math.PI / 2 + TAU * p); ctx.stroke();
    });
  }
  const f = seg(t, 1.9, 2.5);
  if (f > 0) {
    const sc = lerp(0.94, 1, easeBack(f));
    ctx.globalAlpha = clamp(f * 1.6);
    ctx.translate(9.5, 9.5); ctx.scale(sc, sc); ctx.translate(-9.5, -9.5);
    ctx.fillStyle = CONFIG.logoColor; ctx.fill(LOGO_PATH);
  }
  ctx.restore(); ctx.globalAlpha = 1;
}
function drawLogo(t) {
  if (t < 1.0) return;
  const move = easeInOut(seg(t, 3.0, 3.8)), slide = easeInOut(seg(t, 2.3, 3.0));
  const y = lerp(H / 2, L.headerY, move), s = lerp(1, 0.42, move);
  const I = 150, gap = 34, fs = 118;
  setFont(700, fs, SANS, "-0.03em");
  const tw = ctx.measureText(CONFIG.brand).width, total = I + gap + tw;
  ctx.save(); ctx.translate(W / 2, y); ctx.scale(s, s);
  ctx.save(); ctx.translate(lerp(0, -total / 2 + I / 2, slide), 0); ctx.scale(lerp(1.7, 1, slide), lerp(1.7, 1, slide)); drawMark(t, I); ctx.restore();
  ctx.fillStyle = C.text; ctx.textBaseline = "middle"; ctx.textAlign = "left";
  ctx.globalAlpha = seg(t, 2.85, 3.3);
  ctx.fillText(CONFIG.brand, -total / 2 + I + gap, fs * 0.04);
  ctx.restore();
}

/* ---------- headline ---------- */
function drawHeadline(t) {
  const out = 1 - seg(t, 7.4, 7.8); if (out <= 0) return;
  setFont(800, L.fsH, SANS, "-0.03em"); ctx.textAlign = "left"; ctx.textBaseline = "alphabetic"; ctx.fillStyle = C.text;
  for (const w of L.words) {
    const k = easeOut(seg(t, 3.5 + w.i * 0.07, 3.95 + w.i * 0.07)); if (k <= 0) continue;
    ctx.globalAlpha = k * out; ctx.fillText(w.text, w.x, w.y + (1 - k) * 28);
  }
  ctx.globalAlpha = 1;
}

/* ---------- terminal ---------- */
function drawTerminal(t) {
  const k = easeOut(seg(t, 4.2, 4.8)), a = k * (1 - seg(t, 7.4, 7.8)); if (a <= 0) return;
  const { x, y, w, h } = L.term;
  ctx.save(); ctx.globalAlpha = a; ctx.translate(0, (1 - k) * 90);
  ctx.shadowColor = "rgba(0,0,0,.6)"; ctx.shadowBlur = 60; ctx.shadowOffsetY = 20;
  ctx.fillStyle = "#121114"; roundRect(x, y, w, h, 26); ctx.fill();
  ctx.shadowColor = "transparent"; ctx.strokeStyle = "#2b262a"; ctx.lineWidth = 2; roundRect(x, y, w, h, 26); ctx.stroke();
  ["#ff5f57", "#febc2e", "#28c840"].forEach((c, i) => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x + 44 + i * 36, y + 38, 11, 0, TAU); ctx.fill(); });
  setFont(400, L.fm * 0.85, MONO); ctx.fillStyle = C.muted; ctx.textAlign = "left"; ctx.textBaseline = "middle";
  ctx.fillText(CONFIG.terminalTitle, x + 160, y + 39);
  ctx.strokeStyle = "#221e21"; ctx.beginPath(); ctx.moveTo(x, y + 76); ctx.lineTo(x + w, y + 76); ctx.stroke();

  setFont(400, L.fm, MONO); const cw = ctx.measureText("M").width;
  let last = null;
  TERMINAL.forEach((ln, i) => {
    if (t < ln.at) return;
    const ly = y + 76 + 56 + i * L.lineH, lx = x + 40;
    const shown = ln.type ? Math.floor(seg(t, ln.at, ln.at + ln.dur) * ln.text.length) : ln.text.length;
    if (ln.diff) { ctx.globalAlpha = a * 0.12; ctx.fillStyle = ln.color === "red" ? C.red : C.green; ctx.fillRect(x + 18, ly - L.lineH * 0.5, w - 36, L.lineH - 4); ctx.globalAlpha = a; }
    let tx = lx;
    if (ln.prompt) { ctx.fillStyle = C.accent; ctx.fillText("›", tx, ly); tx += cw * 2; }
    ctx.fillStyle = ln.color ? C[ln.color] : C.text;
    ctx.fillText(ln.text.slice(0, shown), tx, ly);
    last = { x: tx + shown * cw, y: ly, typing: ln.type && shown < ln.text.length };
  });
  if (last && (last.typing || Math.floor(t * 2) % 2 === 0)) { ctx.fillStyle = C.accent; ctx.fillRect(last.x + cw * 0.3, last.y - L.fm * 0.55, cw * 0.55, L.fm * 1.1); }
  ctx.restore();
}

/* ---------- closing: points + CTA ---------- */
function drawClosing(t) {
  setFont(700, L.fsP, SANS, "-0.02em"); ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
  L.paras.forEach((p, pi) => {
    const k = easeOut(seg(t, p.at, p.at + 0.45)); if (k <= 0) return;
    ctx.globalAlpha = k; ctx.fillStyle = pi === L.paras.length - 1 ? C.accentLight : C.text;
    p.lines.forEach((line, li) => ctx.fillText(line, W / 2, p.y + L.fsP * 0.85 + li * L.fsP * 1.15 + (1 - k) * 22));
  });
  ctx.globalAlpha = 1;

  const kc = seg(t, 9.0, 9.5);
  if (kc > 0) {
    const s = easeBack(kc);
    setFont(700, L.fsC, SANS, "-0.01em");
    const bw = ctx.measureText(CONFIG.cta).width + 120, bh = 112, pulse = 1 + 0.015 * Math.sin(t * 6) * seg(t, 9.5, 9.6);
    ctx.save(); ctx.globalAlpha = clamp(kc * 2); ctx.translate(W / 2, L.ctaY); ctx.scale(s * pulse, s * pulse);
    ctx.shadowColor = "rgba(224,88,74,.55)"; ctx.shadowBlur = 60;
    ctx.fillStyle = C.accent; roundRect(-bw / 2, -bh / 2, bw, bh, 30); ctx.fill();
    ctx.shadowColor = "transparent"; ctx.fillStyle = "#fff"; ctx.textBaseline = "middle"; ctx.fillText(CONFIG.cta, 0, 3);
    ctx.restore();
  }
  const kf2 = easeOut(seg(t, 9.3, 9.8));
  if (kf2 > 0) {
    setFont(400, L.fsF, SANS); ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillStyle = C.muted;
    ctx.globalAlpha = kf2; ctx.fillText(CONFIG.footnote, W / 2, L.ctaY + 112);
    if (CONFIG.endCredit) { ctx.fillStyle = C.muted; ctx.fillText(CONFIG.endCredit, W / 2, H - 60); }
    ctx.globalAlpha = 1;
  }
}

/* ---------- frame ---------- */
function draw(t) {
  ctx.globalAlpha = 1; ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  const ga = kf(t, [[0, 1], [3.4, 1], [4.4, 0.32], [7.4, 0.32], [8.8, 0.8]]);
  drawGlobe(t, ga);
  drawLogo(t);
  drawHeadline(t);
  drawTerminal(t);
  drawClosing(t);
}

/* ---------- playback + recording ---------- */
let raf = 0, startTs = 0, onDone = null;
function play(cb) {
  cancelAnimationFrame(raf); onDone = cb || null; startTs = performance.now();
  const tick = now => {
    const t = (now - startTs) / 1000;
    draw(Math.min(t, DURATION));
    if (t < DURATION + 0.25) raf = requestAnimationFrame(tick);
    else if (onDone) { const f = onDone; onDone = null; f(); }
  };
  raf = requestAnimationFrame(tick);
}
function record() {
  const types = ["video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"];
  const mime = window.MediaRecorder && types.find(m => MediaRecorder.isTypeSupported(m));
  if (!mime) { alert("This browser can't record canvas video. Use Chrome, or screen-record the page."); return; }
  const rec = new MediaRecorder(canvas.captureStream(60), { mimeType: mime, videoBitsPerSecond: 14000000 });
  const chunks = [];
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  rec.onstop = () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob(chunks, { type: "video/webm" }));
    a.download = `vibecoder-promo-${format}.webm`; a.click();
    document.getElementById("record").textContent = "Record and download .webm";
  };
  document.getElementById("record").textContent = "Recording…";
  rec.start(); play(() => rec.stop());
}
 
addEventListener("keydown", e => { if (e.code === "Space") { e.preventDefault(); play(); } });

layout();
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => { layout(); const q = new URLSearchParams(location.search).get("t"); if (q !== null) draw(+q); else play(); });
</script>
